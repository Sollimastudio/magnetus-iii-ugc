<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGNETUS III</title>
    <meta name="description" content="Escolha seu acesso ao MAGNETUS III: homem ou mulher." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(214, 178, 103, 0.32), transparent 34%),
          radial-gradient(circle at bottom left, rgba(198, 77, 124, 0.2), transparent 34%),
          radial-gradient(circle at bottom right, rgba(57, 101, 201, 0.22), transparent 34%),
          #050508;
        color: #f7efe3;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -40%;
        background: conic-gradient(from 0deg, transparent, rgba(214, 178, 103, 0.12), transparent, rgba(196, 77, 124, 0.08), transparent);
        animation: spin 16s linear infinite;
        pointer-events: none;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .card {
        width: 100%;
        max-width: 460px;
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 34px 22px 26px;
        border: 1px solid rgba(214, 178, 103, 0.24);
        border-radius: 34px;
        background: rgba(8, 8, 12, 0.78);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255,255,255,.06);
      }

      .orb {
        width: 98px;
        height: 98px;
        margin: 0 auto 22px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: radial-gradient(circle, rgba(214, 178, 103, 0.24), rgba(214, 178, 103, 0.04));
        border: 1px solid rgba(214, 178, 103, 0.32);
        box-shadow: 0 0 42px rgba(214, 178, 103, 0.16);
      }

      .orb span {
        font-size: 48px;
        color: #d6b267;
      }

      .eyebrow {
        color: #d6b267;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 14px;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 9vw, 56px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        margin-bottom: 18px;
      }

      p {
        color: rgba(247, 239, 227, 0.68);
        font-size: 16px;
        line-height: 1.55;
        max-width: 340px;
        margin: 0 auto 28px;
      }

      .question {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 16px;
      }

      .actions {
        display: grid;
        gap: 14px;
      }

      a {
        text-decoration: none;
        color: #f7efe3;
        min-height: 70px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.02em;
        border: 1px solid rgba(255,255,255,.1);
        transition: transform .18s ease, border-color .18s ease, background .18s ease;
      }

      a:active {
        transform: scale(.98);
      }

      .mulher {
        background: linear-gradient(135deg, rgba(218, 79, 133, 0.34), rgba(214, 178, 103, 0.12));
      }

      .homem {
        background: linear-gradient(135deg, rgba(64, 114, 222, 0.34), rgba(214, 178, 103, 0.1));
      }

      a:hover {
        transform: translateY(-2px);
        border-color: rgba(214, 178, 103, 0.52);
      }

      .footer {
        margin-top: 22px;
        color: rgba(247, 239, 227, 0.3);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="orb"><span>✧</span></div>
      <div class="eyebrow">MAGNETUS III</div>
      <h1>Escolha seu caminho</h1>
      <p>Para ir direto ao protocolo certo, responda abaixo:</p>
      <div class="question">Você é homem ou mulher?</div>
      <div class="actions">
        <a class="homem" href="https://magnetus-homens.vercel.app">Homem</a>
        <a class="mulher" href="https://magnetus-Sales-page.vercel.app">Mulher</a>
      </div>
      <div class="footer">Sol Lima · Relacione-se</div>
    </main>
  </body>
</html>
